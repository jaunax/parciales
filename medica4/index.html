<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Apuntes</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#1b2230;--muted:#5d6b82;--line:#e3e8f2;--accent:#4f46e5;--accent-soft:#eef0ff;--bad:#e5484d}
@media (prefers-color-scheme:dark){:root{--bg:#0f131c;--panel:#171d2a;--ink:#e8edf7;--muted:#98a4bb;--line:#26303f;--accent:#8b8bf5;--accent-soft:#1e2440;--bad:#ff6b6f}html{color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
     font:15.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:18px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 22px;width:100%;max-width:380px;
     box-shadow:0 1px 3px rgba(20,30,60,.08),0 10px 30px rgba(20,30,60,.08)}
h1{font-size:18px;margin:0 0 4px;display:flex;align-items:center;gap:9px}
.dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#c084fc);box-shadow:0 0 0 4px var(--accent-soft)}
p{color:var(--muted);font-size:13.5px;margin:0 0 18px}
input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;color:var(--ink);outline:none}
input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button{width:100%;margin-top:10px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 13px;font:inherit;font-weight:600;cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:12px;cursor:pointer}
.msg{font-size:13px;margin-top:12px;min-height:18px}
.msg.err{color:var(--bad);font-weight:600}
.msg.ok{color:var(--muted)}
</style>
</head>
<body>
<div class="box">
  <h1><span class="dot"></span> Apuntes</h1>
  <p>Escribí la clave para abrir el material.</p>
  <form id="f">
    <input type="password" id="pw" autocomplete="current-password" autofocus placeholder="Clave">
    <button type="submit" id="go">Entrar</button>
    <label class="chk"><input type="checkbox" id="rec" checked> Recordar en este dispositivo</label>
  </form>
  <div class="msg" id="msg"></div>
</div>

const LS = "apuntes_k";
const $ = s => document.querySelector(s);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ab64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));

async function derivar(clave){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt:b64(DATOS.salt), iterations:DATOS.it, hash:"SHA-256"}, base, 256);
  return bits;
}
async function abrir(bits, recordar){
  const key = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
  const plano = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(DATOS.iv)}, key, b64(DATOS.ct));
  const html = new TextDecoder().decode(plano);
  if (recordar) { try { localStorage.setItem(LS, ab64(bits)); } catch(e){} }
  document.open(); document.write(html); document.close();
}
$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const clave = $("#pw").value;
  if (!clave) return;
  $("#go").disabled = true; $("#msg").className = "msg ok"; $("#msg").textContent = "Abriendo…";
  try {
    await abrir(await derivar(clave), $("#rec").checked);
  } catch(err) {
    $("#msg").className = "msg err"; $("#msg").textContent = "Clave incorrecta.";
    $("#go").disabled = false; $("#pw").select();
  }
});
(async () => {
  if (!crypto.subtle) { $("#msg").className = "msg err"; $("#msg").textContent = "Abrilo con https, no como archivo local."; return; }
  let g = null; try { g = localStorage.getItem(LS); } catch(e){}
  if (!g) return;
  $("#msg").className = "msg ok"; $("#msg").textContent = "Abriendo…";
  try { await abrir(b64(g).buffer, false); }
  catch(err) { try { localStorage.removeItem(LS); } catch(e){} $("#msg").textContent = ""; }
})();
})();
</script>
